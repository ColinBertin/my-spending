<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16">
  <style>
    .ink { fill: #17161A; }
    .frame { fill: none; stroke: #17161A; }
    /* Follows the browser's theme: paper-coloured mark on dark tab bars */
