    }
  </style>
  <rect class="frame" x="7" y="9" width="50" height="46" rx="6" stroke-width="6"/>
  <rect class="ink" x="8" y="22" width="48" height="6"/>
  <rect class="ink" x="14" y="33" width="16" height="10" rx="5"/>
  <rect x="34" y="33" width="16" height="10" rx="5" fill="#E8552F"/>
</svg>
